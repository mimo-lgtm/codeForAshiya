function App() {
  const [activeTab, setActiveTab] = useState(1);

  const sections = [
    {
      id: 1,
      title: "多様な市民の声を活かす、新しい意思決定の仕組みを創る",
      subtitle: "より良い地域の未来に向けた共創の基盤",
      desc: "これまでの行政プロセスの課題： パブリックコメントや従来のアンケートでは、せっかくの貴重な市民の意見が十分に集約されず、行政と市民の対話の機会が限られていました。",

    {
      id: 2,
      title: "市民と行政が一体となって前進するための「共通の土台づくり」",
